name: CI Pipeline (Contro-Dotz)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test-and-verify:
    name: Typecheck, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Comprobar Tipos de TypeScript (Typecheck)
        run: npm run typecheck

      - name: Ejecutar Linter (ESLint)
        run: npm run lint

      - name: Ejecutar Pruebas Unitarias de Finanzas (Vitest)
        run: npm run test

      - name: Instalar Navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Construir Aplicación para Pruebas E2E
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://fnzflibtaxdzqxxtpzzb.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_dummy' }}

      - name: Ejecutar Pruebas End-to-End (Playwright)
        run: npm run test:e2e

      - name: Subir Reporte de Playwright en caso de fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
