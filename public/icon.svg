
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  
    <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
    <rect width="508" height="508" x="2" y="2" rx="110" stroke="url(#primaryGrad)" stroke-width="3" stroke-opacity="0.3" fill="none" />
  

  <g transform="identity" filter="url(#glow)">
    <!-- Connected Dotz Financial Node Network -->
    <path d="M 120 340 C 180 340, 210 240, 270 240 C 330 240, 350 160, 400 150" 
          stroke="url(#primaryGrad)" stroke-width="16" stroke-linecap="round" fill="none" />
    
    <path d="M 120 340 C 180 340, 210 240, 270 240 C 330 240, 350 160, 400 150" 
          stroke="#10b981" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8" />

    <rect x="112" y="340" width="16" height="40" rx="8" fill="#10b981" opacity="0.4" />
    <rect x="262" y="240" width="16" height="140" rx="8" fill="#06b6d4" opacity="0.3" />
    <rect x="392" y="150" width="16" height="230" rx="8" fill="#6366f1" opacity="0.3" />

    <circle cx="120" cy="340" r="28" fill="url(#primaryGrad)" />
    <circle cx="120" cy="340" r="12" fill="#ffffff" />

    <circle cx="270" cy="240" r="32" fill="url(#primaryGrad)" />
    <circle cx="270" cy="240" r="14" fill="#ffffff" />

    <circle cx="400" cy="150" r="36" fill="url(#primaryGrad)" />
    <circle cx="400" cy="150" r="16" fill="#ffffff" />

    <circle cx="180" cy="180" r="14" fill="#34d399" opacity="0.8" />
    <circle cx="340" cy="320" r="18" fill="#818cf8" opacity="0.7" />
    <circle cx="310" cy="120" r="10" fill="#38bdf8" opacity="0.9" />
  </g>
